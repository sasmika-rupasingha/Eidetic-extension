name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  extension:
    name: Types, lint, unit tests, build, Firefox linter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - name: Firefox add-on linter (AMO rules)
        run: npm run lint:firefox
      - uses: actions/upload-artifact@v7
        with:
          name: eidetic-extension
          path: extension/dist/*.zip
          if-no-files-found: error

  e2e:
    name: End-to-end (real Chromium, OCR, mock Ollama and cloud)
    runs-on: ubuntu-latest
    needs: extension
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
